[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zenoh-dslr-pi-runtime"
version = "0.1.0"
description = "Zenoh-native Raspberry Pi DSLR capture runtime"
requires-python = ">=3.10"
dependencies = [
  "eclipse-zenoh>=1.0,<2.0",
  "Pillow>=9.0.0",
  "zenoh-ros2-sdk>=0.1.0",
  "paho-mqtt>=1.6,<3.0",
  # Required by the native ROS 2 Image publisher: rosbags' CDR serializer calls
  # .view() on uint8[] array fields, so Image.data must be a numpy array.
  "numpy>=1.21",
]

[project.optional-dependencies]
# Opt-in: serve camera exposure as ROS 2 parameters (ros2 param get/set) via
# pico-ros-py. Only needed when `exposure.enabled` is true in the config.
#   uv run --extra exposure python3 -m zenoh_dslr_pi_runtime.cli --config ...
exposure = ["pico-ros-py"]

[tool.uv.sources]
pico-ros-py = { path = "../pico-ros-py", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  # The pgwaam online-pulse integration test (tests/test_pgwaam_online_integration.py)
  # runs a REAL MQTT broker on a dynamically-chosen free port. It prefers a local
  # `mosquitto` binary (brew install mosquitto / apt install mosquitto); if that is
  # absent the test skips with a clear reason. To make the test fully self-contained
  # without a system mosquitto, install the optional pure-Python broker below and the
  # test can be extended to launch it:
  #   "amqtt>=0.11",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
