# SPDX-License-Identifier: Apache-2.0
# Self-contained ROS 2 interop CI: prove that the pure-zenoh daemons -- including
# the REAL production `pi_runtime` DSLR daemon (hardware mocked) -- are visible &
# controllable from the stock `ros2` CLI, down to the CDR wire bytes, federating
# only through a raw `zenohd` router. No ROS 2 is installed in any daemon.
#
# The gate is the `verifier` container's exit code (see ci/verifier/verify_integration.sh):
#   GATE 1  ros2 node/service/topic list  -> enumeration (examples + real daemon)
#   GATE 2  ros2 topic echo + cdr_assert.py -> topics + BYTE-LEVEL CDR (String, Float32)
#   GATE 3  ros2 param get|set + reject     -> parameters
#   GATE 4  ros2 service call (SetBool)      -> real pi_runtime capture service
#   GATE 5  ros2 topic echo (Image)          -> native sensor_msgs/msg/Image (semantic)
name: ci

on:
  push:
    paths: ["ci/**", "pico-ros-py/**", "pi_runtime/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["ci/**", "pico-ros-py/**", "pi_runtime/**", ".github/workflows/ci.yml"]
  workflow_dispatch: {}

jobs:
  # Fast pure-Python gate. The Docker interop job below boots the real daemon,
  # but it is slow and only catches import/syntax breakage *indirectly* (a
  # daemon that won't import won't boot). This job is the direct, fail-fast
  # guard: `compileall` catches the build-breaking SyntaxError class that
  # reached `main` via PR #9 (both models.py and runtime.py were unimportable),
  # and pytest runs the existing pi_runtime / pico-ros-py unit suites that were
  # never executed by automation before.
  unit-tests:
    name: pure-Python unit tests (pi_runtime + pico-ros-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax guard (catches unimportable modules before anything else)
        run: python -m compileall -q pi_runtime/zenoh_dslr_pi_runtime pico-ros-py

      - name: Install packages + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./pico-ros-py ./pi_runtime pytest

      - name: Run unit tests
        # mosquitto is not installed on the runner, so the pgwaam MQTT
        # end-to-end test skips itself with a clear reason (by design).
        run: python -m pytest pi_runtime/tests pico-ros-py/tests -v

  ros2-interop:
    name: ros2 CLI + raw-CDR verifies raw-zenoh daemons (incl. real pi_runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring up integration harness and gate on the ros2 verifier
        run: |
          docker compose -f ci/compose.integration.yml up --build \
            --abort-on-container-exit --exit-code-from verifier

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f ci/compose.integration.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f ci/compose.integration.yml down -v
